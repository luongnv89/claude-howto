server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html README.html;

    # Gzip compression for performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback - handle VitePress routing
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Directory index - try README.html first (VitePress convention), then index.html
    location ~ ^/.*/$ {
        try_files $uri/README.html $uri/index.html =404;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Error pages
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}